name: Deploy Docker to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Navigate to the project directory on EC2
            cd currency_conversion/currency-conversion || cd backend || cd ~/currency-conversion

            # 2. Pull latest code from GitHub
            git pull origin master

            # 3. Build and restart containers using Docker Compose
            docker compose up -d --build

            # 4. Clean up unused old Docker images
            docker image prune -f

