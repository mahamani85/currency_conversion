name: Deploy Docker to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "Connected to EC2 successfully as $(whoami)"

            # Check if directory exists, if not clone it
            if [ ! -d "currency_conversion" ] && [ ! -d "currency-conversion" ] && [ ! -d "backend" ]; then
              echo "Repository not found, cloning..."
              git clone https://github.com/mahamani85/currency_conversion.git
            fi

            # Navigate to the project directory
            if [ -d "currency_conversion/currency-conversion" ]; then
              cd currency_conversion/currency-conversion
            elif [ -d "currency_conversion" ]; then
              cd currency_conversion
            elif [ -d "currency-conversion" ]; then
              cd currency-conversion
            elif [ -d "backend" ]; then
              cd backend
            fi

            echo "Current Directory: $(pwd)"

            # Pull latest changes
            git pull origin master

            # Build Spring Boot Docker image directly
            docker build -t currency-app:latest .

            # Run Docker Compose
            docker compose up -d

            # Prune dangling images
            docker image prune -f

